# Despliegue gratuito del backend en Render.com
# Dashboard → New → Blueprint → conectar repo con este archivo

services:
  - type: web
    name: reporte-ensayos-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
